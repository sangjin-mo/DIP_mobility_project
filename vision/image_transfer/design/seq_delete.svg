<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>
  <text x="410" y="28" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자가 "로컬 삭제"를 눌렀을 때 (용량 관리)</text>

  <g><rect x="20" y="50" width="110" height="40" rx="6" fill="#1f2933"/><text x="75" y="75" font-size="12" fill="#ffffff" text-anchor="middle">사용자</text></g>
  <g><rect x="200" y="50" width="150" height="40" rx="6" fill="#2f6feb"/>
     <text x="275" y="68" font-size="11" fill="#ffffff" text-anchor="middle">VIS 통합 서버</text>
     <text x="275" y="82" font-size="9" fill="#dbe6ff" text-anchor="middle">(PC, 웹 UI)</text></g>
  <g><rect x="430" y="50" width="160" height="40" rx="6" fill="#2f6feb"/>
     <text x="510" y="68" font-size="11" fill="#ffffff" text-anchor="middle">upload_server.py</text>
     <text x="510" y="82" font-size="9" fill="#dbe6ff" text-anchor="middle">(Pi, 상시 대기)</text></g>
  <g><rect x="670" y="50" width="130" height="40" rx="6" fill="#52606d"/>
     <text x="735" y="68" font-size="11" fill="#ffffff" text-anchor="middle">Pi 로컬 저장소</text>
     <text x="735" y="82" font-size="9" fill="#e4e7eb" text-anchor="middle">images/날짜별/</text></g>

  <line x1="75" y1="90" x2="75" y2="450" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="275" y1="90" x2="275" y2="450" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="510" y1="90" x2="510" y2="450" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="735" y1="90" x2="735" y2="450" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2933"/></marker>
    <marker id="a3o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>

  <!-- 1 user -> web -->
  <line x1="75" y1="118" x2="271" y2="118" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a3)"/>
  <text x="175" y="111" font-size="10.5" fill="#1f2933" text-anchor="middle">① 이미지 선택 후 "선택 항목 로컬 삭제" 클릭</text>

  <!-- 2 web self -->
  <path d="M279 136 h60 v20 h-60" fill="none" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a3)"/>
  <text x="345" y="132" font-size="10" fill="#1f2933">② 선택 파일이</text>
  <text x="345" y="172" font-size="10" fill="#1f2933">전송 성공(success) 상태인지 확인</text>

  <!-- 3 web -> pitrigger -->
  <line x1="275" y1="196" x2="506" y2="196" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a3)"/>
  <text x="390" y="189" font-size="10.5" fill="#1f2933" text-anchor="middle">③ POST /delete-local {파일 경로 목록}</text>

  <!-- 4 pitrigger self -->
  <path d="M514 214 h70 v20 h-70" fill="none" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a3)"/>
  <text x="585" y="210" font-size="10" fill="#1f2933">④ upload_status.json에서</text>
  <text x="585" y="250" font-size="10" fill="#1f2933">state == success 재검증</text>

  <!-- alt box -->
  <rect x="290" y="270" width="500" height="150" rx="4" fill="none" stroke="#c7cdd4" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="290" y1="340" x2="790" y2="340" stroke="#c7cdd4" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M290 270 h50 v16 l-9 9 h-41 z" fill="#f4f5f7" stroke="#c7cdd4" stroke-width="1.3"/>
  <text x="297" y="283" font-size="9.5" font-weight="bold" fill="#7b8794">alt</text>
  <text x="360" y="283" font-size="10" fill="#7b8794">검증 통과</text>

  <line x1="510" y1="305" x2="731" y2="305" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a3)"/>
  <text x="620" y="298" font-size="10" fill="#1f2933" text-anchor="middle">⑤ 해당 파일 삭제</text>

  <line x1="510" y1="325" x2="279" y2="325" stroke="#52606d" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#a3o)"/>
  <text x="395" y="320" font-size="9.5" fill="#52606d" text-anchor="middle">⑥ 삭제 결과 (성공/거부 건수)</text>

  <text x="360" y="356" font-size="10" fill="#7b8794">미전송 파일 포함</text>
  <line x1="510" y1="386" x2="279" y2="386" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#a3o)"/>
  <text x="395" y="381" font-size="9.5" fill="#c0392b" text-anchor="middle">거부: 전송 안 된 파일은 삭제 불가</text>

  <!-- final -->
  <line x1="275" y1="434" x2="79" y2="434" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a3o)"/>
  <text x="175" y="427" font-size="10.5" fill="#52606d" text-anchor="middle">⑦ 결과 표시</text>

  <rect x="20" y="450" width="760" height="0" fill="none"/>
  <text x="410" y="468" font-size="10" fill="#9aa5b1" text-anchor="middle">source: 이미지_저장전송_구현설계.md §4-3 · 안전장치: 전송 성공하지 않은 파일은 PC·Pi 양쪽에서 이중 검증 후 삭제 거부</text>
</svg>
