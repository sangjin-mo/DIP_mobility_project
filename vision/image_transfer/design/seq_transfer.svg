<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="28" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자가 "전송 요청"을 눌렀을 때</text>

  <!-- headers -->
  <g><rect x="20" y="50" width="120" height="40" rx="6" fill="#1f2933"/><text x="80" y="75" font-size="12" fill="#ffffff" text-anchor="middle">사용자</text></g>
  <g><rect x="180" y="50" width="150" height="40" rx="6" fill="#2f6feb"/>
     <text x="255" y="68" font-size="11" fill="#ffffff" text-anchor="middle">VIS 통합 서버</text>
     <text x="255" y="82" font-size="9" fill="#dbe6ff" text-anchor="middle">(PC, 웹 UI)</text></g>
  <g><rect x="370" y="50" width="150" height="40" rx="6" fill="#2f6feb"/>
     <text x="445" y="68" font-size="11" fill="#ffffff" text-anchor="middle">upload_server.py</text>
     <text x="445" y="82" font-size="9" fill="#dbe6ff" text-anchor="middle">(Pi, 상시 대기)</text></g>
  <g><rect x="560" y="50" width="130" height="40" rx="6" fill="#52606d"/>
     <text x="625" y="68" font-size="11" fill="#ffffff" text-anchor="middle">Pi 로컬 저장소</text>
     <text x="625" y="82" font-size="9" fill="#e4e7eb" text-anchor="middle">images/날짜별/</text></g>
  <g><rect x="730" y="50" width="130" height="40" rx="6" fill="#2f6feb"/>
     <text x="795" y="68" font-size="11" fill="#ffffff" text-anchor="middle">VIS 통합 서버</text>
     <text x="795" y="82" font-size="9" fill="#dbe6ff" text-anchor="middle">(PC, 수신 엔드포인트)</text></g>
  <g><rect x="900" y="50" width="60" height="40" rx="6" fill="#52606d"/>
     <text x="930" y="68" font-size="10" fill="#ffffff" text-anchor="middle">PC</text>
     <text x="930" y="80" font-size="9" fill="#e4e7eb" text-anchor="middle">저장소</text></g>

  <!-- lifelines -->
  <line x1="80" y1="90" x2="80" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="255" y1="90" x2="255" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="445" y1="90" x2="445" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="625" y1="90" x2="625" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="795" y1="90" x2="795" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="930" y1="90" x2="930" y2="540" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2933"/></marker>
    <marker id="a2o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>

  <!-- 1 user -> web -->
  <line x1="80" y1="118" x2="251" y2="118" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="166" y="111" font-size="10.5" fill="#1f2933" text-anchor="middle">① "전송 요청" 클릭</text>

  <!-- 2 web -> pitrigger -->
  <line x1="255" y1="142" x2="441" y2="142" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="350" y="135" font-size="10.5" fill="#1f2933" text-anchor="middle">② POST /trigger-upload</text>

  <!-- 3 pitrigger -> pidisk -->
  <line x1="445" y1="166" x2="621" y2="166" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="533" y="159" font-size="10.5" fill="#1f2933" text-anchor="middle">③ 미전송 파일 스캔</text>

  <!-- loop box -->
  <rect x="405" y="190" width="440" height="230" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M405 190 h60 v18 l-10 10 h-50 z" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="413" y="204" font-size="10" font-weight="bold" fill="#52606d">loop</text>
  <text x="490" y="210" font-size="10.5" fill="#52606d">파일마다</text>

  <!-- 4 pitrigger -> checksum self -->
  <path d="M449 224 h50 v18 h-50" fill="none" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a2)"/>
  <text x="504" y="220" font-size="10" fill="#1f2933">④ SHA-256 체크섬 계산</text>

  <!-- 5 pitrigger -> recv upload -->
  <line x1="445" y1="270" x2="791" y2="270" stroke="#1f2933" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="618" y="263" font-size="10.5" fill="#1f2933" text-anchor="middle">⑤ POST /upload (파일 + 체크섬)</text>

  <!-- 6 recv self verify -->
  <path d="M799 288 h50 v18 h-50" fill="none" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a2)"/>
  <text x="854" y="284" font-size="10" fill="#1f2933">⑥ 체크섬</text>
  <text x="854" y="322" font-size="10" fill="#1f2933">재계산·비교</text>

  <!-- alt box -->
  <rect x="430" y="336" width="480" height="110" rx="4" fill="none" stroke="#c7cdd4" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="430" y1="392" x2="910" y2="392" stroke="#c7cdd4" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M430 336 h50 v16 l-9 9 h-41 z" fill="#f4f5f7" stroke="#c7cdd4" stroke-width="1.3"/>
  <text x="437" y="349" font-size="9.5" font-weight="bold" fill="#7b8794">alt</text>
  <text x="500" y="349" font-size="10" fill="#7b8794">체크섬 일치</text>

  <!-- 7a recv -> pcdisk -->
  <line x1="795" y1="368" x2="926" y2="368" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a2)"/>
  <text x="860" y="362" font-size="9.5" fill="#1f2933" text-anchor="middle">저장</text>

  <!-- 7b recv --> pitrigger 200 -->
  <line x1="795" y1="386" x2="449" y2="386" stroke="#52606d" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#a2o)"/>
  <text x="620" y="382" font-size="9.5" fill="#52606d" text-anchor="middle">200 OK → 상태 success 기록</text>

  <text x="500" y="405" font-size="10" fill="#7b8794">불일치</text>
  <line x1="795" y1="420" x2="449" y2="420" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#a2o)"/>
  <text x="620" y="416" font-size="9.5" fill="#c0392b" text-anchor="middle">400 checksum_mismatch → 상태 failed (다음 요청 때 재시도)</text>

  <!-- final: pitrigger -> web result -->
  <line x1="445" y1="470" x2="259" y2="470" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a2o)"/>
  <text x="350" y="463" font-size="10.5" fill="#52606d" text-anchor="middle">⑦ 전송 결과 (요청/성공/실패 건수)</text>

  <line x1="255" y1="500" x2="84" y2="500" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a2o)"/>
  <text x="166" y="493" font-size="10.5" fill="#52606d" text-anchor="middle">⑧ 결과 표시 + 목록 갱신</text>

  <text x="490" y="550" font-size="10" fill="#9aa5b1" text-anchor="middle">source: 이미지_저장전송_구현설계.md §4-2</text>
</svg>
