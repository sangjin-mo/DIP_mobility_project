<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="28" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">평상시 — 촬영·저장 (라즈베리파이 단독, 계속 반복)</text>

  <!-- Lifeline headers -->
  <g>
    <rect x="60" y="50" width="140" height="36" rx="6" fill="#1f2933"/>
    <text x="130" y="73" font-size="13" fill="#ffffff" text-anchor="middle">USB 웹캠</text>
  </g>
  <g>
    <rect x="300" y="50" width="160" height="36" rx="6" fill="#2f6feb"/>
    <text x="380" y="68" font-size="12" fill="#ffffff" text-anchor="middle">capture.py</text>
    <text x="380" y="82" font-size="10" fill="#dbe6ff" text-anchor="middle">(systemd 상시 실행)</text>
  </g>
  <g>
    <rect x="540" y="50" width="150" height="36" rx="6" fill="#52606d"/>
    <text x="615" y="68" font-size="12" fill="#ffffff" text-anchor="middle">Pi 로컬 저장소</text>
    <text x="615" y="82" font-size="10" fill="#e4e7eb" text-anchor="middle">images/날짜별/</text>
  </g>

  <!-- Lifelines -->
  <line x1="130" y1="86" x2="130" y2="330" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="380" y1="86" x2="380" y2="330" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="615" y1="86" x2="615" y2="330" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- loop box -->
  <rect x="90" y="110" width="580" height="200" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M90 110 h64 v18 l-10 10 h-54 z" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="100" y="124" font-size="10" font-weight="bold" fill="#52606d">loop</text>
  <text x="200" y="132" font-size="11" fill="#52606d">1초마다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f2933"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#52606d" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- msg 1: capture -> cam -->
  <line x1="380" y1="160" x2="134" y2="160" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="255" y="153" font-size="11" fill="#1f2933" text-anchor="middle">① 프레임 읽기</text>

  <!-- msg 2: cam --> capture (dashed return) -->
  <line x1="130" y1="196" x2="376" y2="196" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-open)"/>
  <text x="255" y="189" font-size="11" fill="#52606d" text-anchor="middle">② 이미지 프레임 반환</text>

  <!-- msg 3: capture self -->
  <path d="M384 218 h60 v20 h-60" fill="none" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="450" y="212" font-size="11" fill="#1f2933">③ 파일명 생성</text>
  <text x="450" y="252" font-size="10" fill="#7b8794">(촬영시간_cam01_순번.jpg)</text>

  <!-- msg 4: capture -> disk -->
  <line x1="380" y1="286" x2="611" y2="286" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="497" y="279" font-size="11" fill="#1f2933" text-anchor="middle">④ 저장 (imencode + tofile)</text>

  <text x="360" y="348" font-size="10" fill="#9aa5b1" text-anchor="middle">source: 이미지_저장전송_구현설계.md §4-1</text>
</svg>
