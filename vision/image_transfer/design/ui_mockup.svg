<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="960" height="640" fill="#f4f5f7"/>

  <!-- 상단 헤더 -->
  <rect x="0" y="0" width="960" height="64" fill="#1f2933"/>
  <text x="24" y="40" font-size="20" font-weight="bold" fill="#ffffff">VIS 통합 서버 — 이미지 저장·전송 관리</text>
  <circle cx="900" cy="32" r="6" fill="#2ecc71"/>
  <text x="880" y="37" font-size="12" fill="#cbd2d9" text-anchor="end">Pi 2호기 연결됨</text>

  <!-- 상태 요약 카드 3개 -->
  <g>
    <rect x="24" y="88" width="288" height="88" rx="8" fill="#ffffff" stroke="#e4e7eb"/>
    <text x="44" y="118" font-size="12" fill="#7b8794">라즈베리파이 로컬 미전송</text>
    <text x="44" y="150" font-size="28" font-weight="bold" fill="#1f2933">42장</text>
  </g>
  <g>
    <rect x="336" y="88" width="288" height="88" rx="8" fill="#ffffff" stroke="#e4e7eb"/>
    <text x="356" y="118" font-size="12" fill="#7b8794">PC 수신 완료(오늘)</text>
    <text x="356" y="150" font-size="28" font-weight="bold" fill="#1f2933">318장</text>
  </g>
  <g>
    <rect x="648" y="88" width="288" height="88" rx="8" fill="#ffffff" stroke="#e4e7eb"/>
    <text x="668" y="118" font-size="12" fill="#7b8794">Pi 저장소 사용량</text>
    <text x="668" y="150" font-size="28" font-weight="bold" fill="#e67e22">1.2GB / 8GB</text>
  </g>

  <!-- 액션 버튼 영역 -->
  <rect x="24" y="196" width="912" height="56" rx="8" fill="#ffffff" stroke="#e4e7eb"/>
  <rect x="40" y="210" width="140" height="28" rx="6" fill="#2f6feb"/>
  <text x="110" y="229" font-size="13" fill="#ffffff" text-anchor="middle">전송 요청</text>

  <rect x="196" y="210" width="160" height="28" rx="6" fill="#c0392b"/>
  <text x="276" y="229" font-size="13" fill="#ffffff" text-anchor="middle">선택 항목 로컬 삭제</text>

  <rect x="372" y="210" width="160" height="28" rx="6" fill="#9aa5b1"/>
  <text x="452" y="229" font-size="13" fill="#ffffff" text-anchor="middle">분석 시작 (준비중)</text>

  <text x="908" y="229" font-size="12" fill="#7b8794" text-anchor="end">마지막 전송: 2026-08-20 17:03</text>

  <!-- 이미지 그리드 헤더 -->
  <text x="24" y="284" font-size="14" font-weight="bold" fill="#1f2933">수신된 이미지 (received/2026-08-20/)</text>

