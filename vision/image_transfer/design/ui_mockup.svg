    <text x="408" y="424" font-size="10" fill="#52606d">20260820_170307_cam01_001.jpg</text>

    <!-- 썸네일 4 -->
    <rect x="588" y="300" width="176" height="132" rx="6" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="596" y="308" width="160" height="100" rx="4" fill="#d9dde3"/>
    <path d="M616 388 L648 348 L668 372 L692 344 L736 388 Z" fill="#aeb6bf"/>
    <circle cx="624" cy="324" r="8" fill="#c7cdd4"/>
