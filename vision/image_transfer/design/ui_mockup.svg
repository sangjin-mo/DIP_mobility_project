    <text x="596" y="424" font-size="10" fill="#52606d">20260820_170308_cam01_001.jpg</text>

    <!-- 썸네일 5 -->
    <rect x="776" y="300" width="160" height="132" rx="6" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="784" y="308" width="144" height="100" rx="4" fill="#d9dde3"/>
    <path d="M800 388 L828 348 L846 372 L866 344 L906 388 Z" fill="#aeb6bf"/>
    <circle cx="808" cy="324" r="8" fill="#c7cdd4"/>
    <rect x="788" y="312" width="14" height="14" rx="3" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="784" y="424" font-size="10" fill="#52606d">20260820_170309...jpg</text>
  </g>

  <!-- 두번째 줄 -->
  <g>
    <rect x="24" y="448" width="176" height="132" rx="6" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="32" y="456" width="160" height="100" rx="4" fill="#d9dde3"/>
    <path d="M52 536 L84 496 L104 520 L128 492 L172 536 Z" fill="#aeb6bf"/>
    <circle cx="60" cy="472" r="8" fill="#c7cdd4"/>
    <rect x="36" y="460" width="14" height="14" rx="3" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="32" y="572" font-size="10" fill="#52606d">20260820_170310_cam01_001.jpg</text>

    <rect x="212" y="448" width="176" height="132" rx="6" fill="#ffffff" stroke="#e4e7eb" stroke-dasharray="4 4"/>
    <text x="300" y="518" font-size="12" fill="#9aa5b1" text-anchor="middle">+ 313장 더보기</text>
  </g>

  <!-- 하단 안내 -->
  <rect x="588" y="448" width="348" height="132" rx="8" fill="#eef4ff" stroke="#c8dcff"/>
  <text x="608" y="474" font-size="12" font-weight="bold" fill="#1f4b99">향후 확장 지점</text>
  <text x="608" y="496" font-size="11" fill="#2c5aa0">이 화면의 "분석 시작" 버튼이 활성화되면,</text>
  <text x="608" y="514" font-size="11" fill="#2c5aa0">같은 서버 프로세스 안에서 수신된 이미지를</text>
  <text x="608" y="532" font-size="11" fill="#2c5aa0">AI 분석 모듈(Florence-2 등)로 바로 전달합니다.</text>
  <text x="608" y="550" font-size="11" fill="#2c5aa0">별도 전송/연동 단계가 필요 없는 구조입니다.</text>

  <!-- 푸터 -->
  <text x="24" y="620" font-size="11" fill="#9aa5b1">이 화면은 구현 전 설계 단계의 예상도(목업)입니다. 실제 UI와 다를 수 있습니다.</text>
