<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>
  <text x="550" y="28" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">표지판 인식 → 정지 → 재출발 시퀀스</text>

  <!-- Lifeline headers -->
  <g>
    <rect x="40" y="48" width="150" height="36" rx="6" fill="#b45309"/>
    <text x="115" y="66" font-size="12" fill="#ffffff" text-anchor="middle">PC 제어 서버</text>
    <text x="115" y="80" font-size="9" fill="#fde4c0" text-anchor="middle">(출발·정지·속도 제어)</text>
  </g>
  <g>
    <rect x="225" y="48" width="130" height="36" rx="6" fill="#1f2933"/>
    <text x="290" y="71" font-size="12" fill="#ffffff" text-anchor="middle">측면 카메라</text>
  </g>
  <g>
    <rect x="420" y="48" width="170" height="36" rx="6" fill="#2f6feb"/>
    <text x="505" y="66" font-size="12" fill="#ffffff" text-anchor="middle">detector.py</text>
    <text x="505" y="80" font-size="9" fill="#dbe6ff" text-anchor="middle">(2호기, 상시 실행)</text>
  </g>
  <g>
    <rect x="645" y="48" width="140" height="36" rx="6" fill="#52606d"/>
    <text x="715" y="66" font-size="12" fill="#ffffff" text-anchor="middle">GPIO 핀</text>
    <text x="715" y="80" font-size="9" fill="#e4e7eb" text-anchor="middle">(2호기 OUT ↔ 1호기 IN)</text>
  </g>
  <g>
    <rect x="840" y="48" width="170" height="36" rx="6" fill="#8a4baf"/>
    <text x="925" y="66" font-size="12" fill="#ffffff" text-anchor="middle">1호기</text>
    <text x="925" y="80" font-size="9" fill="#efe3f7" text-anchor="middle">(라인트레이싱·모터 제어)</text>
  </g>

  <!-- Lifelines -->
  <line x1="115" y1="84" x2="115" y2="770" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="290" y1="84" x2="290" y2="770" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="505" y1="84" x2="505" y2="770" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="715" y1="84" x2="715" y2="770" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="925" y1="84" x2="925" y2="770" stroke="#c7cdd4" stroke-width="1.5" stroke-dasharray="4 3"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f2933"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#52606d" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b3261e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1e8e3e"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===== 사전조건: PC가 주행 상태를 푸시 (§3-2) ===== -->
  <line x1="115" y1="108" x2="501" y2="108" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="310" y="101" font-size="10" fill="#b45309" text-anchor="middle">⓪ POST /vehicle-state (driving: true/false)</text>
  <rect x="160" y="120" width="690" height="34" rx="4" fill="#fff7ed" stroke="#f3d0a0" stroke-width="1"/>
  <text x="505" y="134" font-size="10" fill="#92400e" text-anchor="middle">driving 플래그 확인 — false면 아래 전체 과정을 생략(카메라 대기만), true일 때만 진행 (§3-2)</text>
  <text x="505" y="148" font-size="9" fill="#b45309" text-anchor="middle">(주행 중이 아닐 때 불필요한 YOLO 추론을 막아 2호기 자원을 아낌)</text>

  <!-- ===== Loop 1: 표지판이 시야에 들어옴 ===== -->
  <rect x="160" y="168" width="670" height="145" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M160 168 h70 v18 l-10 10 h-60 z" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="182" font-size="10" font-weight="bold" fill="#52606d">loop</text>
  <text x="330" y="188" font-size="11" fill="#52606d">driving=true 이고, 표지판이 인식될 때까지 — 매 프레임</text>

  <line x1="505" y1="212" x2="294" y2="212" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="400" y="205" font-size="10" fill="#1f2933" text-anchor="middle">① 프레임 읽기</text>

  <line x1="290" y1="234" x2="501" y2="234" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-open)"/>
  <text x="400" y="227" font-size="10" fill="#52606d" text-anchor="middle">② 프레임 반환</text>

  <path d="M509 254 h70 v20 h-70" fill="none" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="585" y="248" font-size="10" fill="#1f2933">③ YOLO 추론 → "stop sign" 탐지 시</text>
  <text x="585" y="292" font-size="9" fill="#7b8794">연속 탐지 카운터 +1 (디바운스 N)</text>

  <!-- N frames confirmed: GPIO HIGH -->
  <text x="620" y="332" font-size="10" font-weight="bold" fill="#b3261e" text-anchor="middle">연속 N프레임 탐지 확정 → 정지 신호 전송</text>

  <line x1="505" y1="347" x2="711" y2="347" stroke="#b3261e" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="608" y="340" font-size="10" fill="#b3261e" text-anchor="middle">④ GPIO OUT = HIGH</text>

  <line x1="719" y1="347" x2="921" y2="347" stroke="#b3261e" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="820" y="340" font-size="10" fill="#b3261e" text-anchor="middle">⑤ 전압 상승 (물리 신호)</text>

  <path d="M929 367 h70 v20 h-70" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#arrow-red)"/>
  <text x="925" y="412" font-size="10" fill="#b3261e" text-anchor="middle">⑥ 인터럽트 콜백 실행</text>
  <text x="925" y="426" font-size="10" font-weight="bold" fill="#b3261e" text-anchor="middle">→ 모터 정지</text>

  <!-- ===== 쿨다운 (§3-1) ===== -->
  <rect x="420" y="448" width="380" height="46" rx="4" fill="#fef2f2" stroke="#f3b4b0" stroke-width="1"/>
  <text x="610" y="466" font-size="10" font-weight="bold" fill="#b3261e" text-anchor="middle">쿨다운 시작 — 고정 시간 동안 같은 표지판 재신호 억제</text>
  <text x="610" y="481" font-size="9" fill="#b3261e" text-anchor="middle">(재출발 직후 즉시 재정지되는 문제 방지, §3-1)</text>

  <!-- ===== Loop 2: 표지판이 시야에서 사라짐 (지나감) ===== -->
  <rect x="160" y="512" width="670" height="145" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M160 512 h70 v18 l-10 10 h-60 z" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="526" font-size="10" font-weight="bold" fill="#52606d">loop</text>
  <text x="350" y="532" font-size="11" fill="#52606d">표지판이 안 잡힐 때까지, 매 프레임 (정지 상태 유지 중)</text>

  <line x1="505" y1="556" x2="294" y2="556" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="400" y="549" font-size="10" fill="#1f2933" text-anchor="middle">⑦ 프레임 읽기</text>

  <line x1="290" y1="578" x2="501" y2="578" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-open)"/>
  <text x="400" y="571" font-size="10" fill="#52606d" text-anchor="middle">⑧ 프레임 반환</text>

  <path d="M509 598 h70 v20 h-70" fill="none" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="585" y="592" font-size="10" fill="#1f2933">⑨ YOLO 추론 → 미탐지</text>
  <text x="585" y="636" font-size="9" fill="#7b8794">연속 미탐지 카운터 +1 (디바운스 M)</text>

  <text x="620" y="676" font-size="10" font-weight="bold" fill="#1e8e3e" text-anchor="middle">연속 M프레임 미탐지 확정 → 정지 해제 신호 전송</text>

  <line x1="505" y1="691" x2="711" y2="691" stroke="#1e8e3e" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="608" y="684" font-size="10" fill="#1e8e3e" text-anchor="middle">⑩ GPIO OUT = LOW</text>

  <line x1="719" y1="691" x2="921" y2="691" stroke="#1e8e3e" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="820" y="684" font-size="10" fill="#1e8e3e" text-anchor="middle">⑪ 전압 하강 (물리 신호)</text>

  <path d="M929 711 h70 v20 h-70" fill="none" stroke="#1e8e3e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <text x="925" y="756" font-size="10" fill="#1e8e3e" text-anchor="middle">⑫ 인터럽트 콜백 실행</text>
  <text x="925" y="770" font-size="10" font-weight="bold" fill="#1e8e3e" text-anchor="middle">→ 모터 재개</text>

  <text x="550" y="800" font-size="9" fill="#9aa5b1" text-anchor="middle">source: features/stop_sign/design/README.md §3, §3-1, §3-2, §4</text>
</svg>
