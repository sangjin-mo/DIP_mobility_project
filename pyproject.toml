[project]
name = "ai-report"
version = "0.1.0"
description = "AI Report Subsystem for the smart agricultural patrol rover project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pillow>=10.0",
    "openai>=1.30,<2.0",  # GUIDELINES.md pins "OpenAI Python SDK v1.x" explicitly
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "jsonschema>=4.20",
]

[project.scripts]
ai-report = "ai_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_report"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
